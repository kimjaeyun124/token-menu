name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic tests
        run: swift test

      - name: Build universal DMG
        run: ./scripts/build-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/token-menu-${version}-macOS-universal.dmg" \
            "dist/token-menu-${version}-macOS-universal.dmg.sha256" \
            --title "Token Menu ${version}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
